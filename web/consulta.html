<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#157A8C" />
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
    <title>Consultar protocolo — SuperMudanças</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand-lockup" href="index.html" aria-label="SuperMudanças — início">
          <svg class="brand-mark" viewBox="0 0 64 64" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="smMark5" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#0E2433"/>
                  <stop offset="0.55" stop-color="#157A8C"/>
                  <stop offset="1" stop-color="#1A9AA8"/>
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="16" fill="url(#smMark5)"/>
              <path fill="#FFFFFF" d="M18 34.5 32 22l14 12.5V46a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3V34.5Z"/>
              <path fill="#0E2433" opacity="0.18" d="M28 49h8v-9a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v9Z"/>
              <path fill="none" stroke="#F0A202" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M14 18c8-6 18-6 28 1"/>
              <path fill="#F0A202" d="M40.2 14.4 48.5 19l-6.8 5.2 1.2-4.6 4.1-.8-6.8-4.4Z"/>
            </svg>
          <span class="brand">Super<span>Mudanças</span></span>
        </a>
        <a class="btn btn-ghost" href="index.html">Voltar ao site</a>
      </div>
    </header>

    <main class="section">
      <div class="container" style="max-width: 640px">
        <div class="section__head">
          <h1 style="font-size: var(--text-h2)">Consultar protocolo</h1>
          <p>Informe o protocolo recebido (ex.: SM2607171234) para ver o status da solicitação.</p>
        </div>

        <form class="contact__form" data-protocol-form novalidate>
          <label>
            Protocolo
            <input
              type="text"
              name="protocolo"
              required
              placeholder="SM2607171234"
              autocomplete="off"
              style="text-transform: uppercase"
            />
          </label>
          <p class="contact__feedback" data-protocol-feedback hidden></p>
          <button class="btn btn-primary" type="submit">Consultar</button>
        </form>

        <div class="protocol-result" data-protocol-result hidden style="margin-top: 2rem"></div>
      </div>
    </main>

    <script>
      (function () {
        var form = document.querySelector("[data-protocol-form]");
        var feedback = document.querySelector("[data-protocol-feedback]");
        var result = document.querySelector("[data-protocol-result]");
        if (!form) return;

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          var protocolo = String(new FormData(form).get("protocolo") || "")
            .trim()
            .toUpperCase();
          if (!protocolo) return;

          feedback.hidden = false;
          feedback.classList.remove("is-error");
          feedback.textContent = "Consultando…";
          result.hidden = true;

          try {
            var response = await fetch("/api/solicitacoes/" + encodeURIComponent(protocolo));
            var data = await response.json();
            if (!response.ok) {
              throw new Error(data.message || "Protocolo não encontrado.");
            }

            feedback.hidden = true;
            result.hidden = false;
            result.innerHTML =
              '<div class="success" style="padding:0">' +
              "<h2>Solicitação encontrada</h2>" +
              '<div class="protocol">Protocolo ' +
              data.protocolo +
              "</div>" +
              "<p><strong>Cliente:</strong> " +
              data.nome +
              "</p>" +
              "<p><strong>Rota:</strong> " +
              data.origem_cidade +
              "/" +
              data.origem_uf +
              " → " +
              data.destino_cidade +
              "/" +
              data.destino_uf +
              "</p>" +
              "<p><strong>Data preferida:</strong> " +
              data.data_preferida +
              " · " +
              data.janela_horario +
              "</p>" +
              "<p><strong>Serviço:</strong> " +
              data.tipo_servico +
              " · porte " +
              data.porte +
              "</p>" +
              '<p class="caption">Recebida em ' +
              new Date(data.created_at).toLocaleString("pt-BR") +
              "</p>" +
              "</div>";
          } catch (error) {
            feedback.classList.add("is-error");
            feedback.textContent = error.message || "Não foi possível consultar.";
          }
        });
      })();
    </script>
  </body>
</html>
